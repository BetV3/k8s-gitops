apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-signed
  namespace: hello-signed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-signed
  template:
    metadata:
      labels:
        app: hello-signed
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/betv3/hello-signed:v1.0.0 # pinned by digest in the env overlay
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
